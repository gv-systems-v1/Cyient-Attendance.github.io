<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | WorkFlow</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="dashboard-wrapper">
        <div class="sidebar">
            <div class="logo">Cyient-WorkFlow</div>
            <div class="user-profile">
                <p>Logged in as</p>
                <div id="userName">Loading...</div>
            </div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <div class="main-content">
            <div class="header-flex">
                <div>
                    <h2>My Attendance</h2>
                    <p id="todayDateDisplay" style="color: #2563eb; font-weight: 600; margin: 5px 0;"></p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-dash btn-present" id="btnP">
                        <span class="btn-icon">✓</span>
                        <div class="btn-text">
                            <span class="btn-title">Check In</span>
                            <span class="btn-desc">Present</span>
                        </div>
                    </button>

                    <button class="btn-dash btn-leave" id="btnL">
                        <span class="btn-icon">✕</span>
                        <div class="btn-text">
                            <span class="btn-title">On Leave</span>
                            <span class="btn-desc">Absent</span>
                        </div>
                    </button>
                </div>
            </div>

            <div class="calendar-card">
                <div class="calendar-header-flex">
                    <div class="nav-controls">
                        <button class="nav-arrow" id="prevMonth">❮</button>
                        <button class="nav-arrow" id="nextMonth">❯</button>
                        <button class="btn-today" id="jumpToday">Jump to Today</button>
                    </div>
                    <div class="calendar-header-text" id="monthDisplay">Month Year</div>
                </div>
                <div class="calendar-grid" id="calendar"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyC_ZrkX3tODa4nDyl9DhAX0llp43i-vAHA", 
            authDomain: "attendance-management-sy-5d69a.firebaseapp.com", 
            projectId: "attendance-management-sy-5d69a", 
            storageBucket: "attendance-management-sy-5d69a.firebasestorage.app", 
            messagingSenderId: "654602757590", 
            appId: "1:654602757590:web:aeb342f787081930d3b077" 
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const now = new Date();
        const localDate = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        let currentViewDate = new Date();

        // 2026 Holidays
        const holidays = {
            "2026-01-01": "New Year",
            "2026-01-15": "Makar Sankranti",
            "2026-01-26": "Republic Day",
            "2026-05-01": "Labour Day",
            "2026-09-14": "Ganesh Chaturthi",
            "2026-10-02": "Gandhi Jayanti",
            "2026-10-21": "Dussehra",
            "2026-12-25": "Christmas"
        };

        document.getElementById('todayDateDisplay').innerText = "Today: " + localDate;

        onAuthStateChanged(auth, async user => {
            if(!user) window.location.href="index.html";
            else {
                const d = await getDoc(doc(db, "users", user.uid));
                if(d.exists() && d.data().role === 'admin') window.location.href="admin.html";
                document.getElementById('userName').innerText = d.data()?.fullName || "User";
                
                checkTodayStatus(user.uid);
                loadCal(user.uid);
            }
        });

        document.getElementById('prevMonth').onclick = () => {
            currentViewDate.setMonth(currentViewDate.getMonth() - 1);
            loadCal(auth.currentUser.uid);
        };

        document.getElementById('nextMonth').onclick = () => {
            currentViewDate.setMonth(currentViewDate.getMonth() + 1);
            loadCal(auth.currentUser.uid);
        };

        document.getElementById('jumpToday').onclick = () => {
            currentViewDate = new Date();
            loadCal(auth.currentUser.uid);
        };

        async function checkTodayStatus(uid) {
            const todayDoc = await getDoc(doc(db, "attendance", `${uid}_${localDate}`));
            if (todayDoc.exists()) {
                const btnP = document.getElementById('btnP');
                const btnL = document.getElementById('btnL');
                btnP.disabled = true;
                btnL.disabled = true;
                btnP.style.opacity = "0.5";
                btnL.style.opacity = "0.5";
                document.querySelectorAll('.btn-title').forEach(el => el.innerText = "Marked Today");
            }
        }

        async function mark(s) {
            try {
                await setDoc(doc(db, "attendance", `${auth.currentUser.uid}_${localDate}`), { 
                    uid: auth.currentUser.uid, 
                    date: localDate, 
                    status: s, 
                    name: document.getElementById('userName').innerText 
                });
                Swal.fire('Success', `Attendance marked as ${s}`, 'success').then(() => location.reload());
            } catch (e) {
                Swal.fire('Error', 'Failed to mark attendance', 'error');
            }
        }

        async function loadCal(uid) {
            const q = query(collection(db, "attendance"), where("uid", "==", uid));
            const snap = await getDocs(q);
            const logs = {}; 
            snap.forEach(d => logs[d.data().date] = d.data().status);
            
            const cal = document.getElementById('calendar');
            cal.innerHTML = ""; 

            const vYear = currentViewDate.getFullYear();
            const vMonth = currentViewDate.getMonth();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('monthDisplay').innerText = `${monthNames[vMonth]} ${vYear}`;

            const daysArr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            daysArr.forEach(day => {
                cal.innerHTML += `<div class="day-name">${day}</div>`;
            });

            const firstDayIndex = new Date(vYear, vMonth, 1).getDay(); 
            const daysInMonth = new Date(vYear, vMonth + 1, 0).getDate();

            for(let x = 0; x < firstDayIndex; x++) {
                cal.innerHTML += `<div class="day day-hidden"></div>`;
            }
            
            for(let i = 1; i <= daysInMonth; i++) {
                const monthPad = String(vMonth + 1).padStart(2, '0');
                const dayPad = String(i).padStart(2, '0');
                const dateKey = `${vYear}-${monthPad}-${dayPad}`;
                
                const dayOfWeek = new Date(vYear, vMonth, i).getDay();
                const holidayName = holidays[dateKey];
                
                let cls = "";
                if (logs[dateKey] === 'Present') cls = 'present';
                else if (logs[dateKey] === 'Leave') cls = 'leave';
                
                const todayCls = (dateKey === localDate) ? "today-circle" : "";
                
                // Set Weekend or Holiday logic
                let specialCls = "";
                if (holidayName) specialCls = "holiday";
                else if (dayOfWeek === 0 || dayOfWeek === 6) specialCls = "weekend";

                cal.innerHTML += `
                    <div class="day ${cls} ${todayCls} ${specialCls}">
                        ${i}
                        ${holidayName ? `<span class="holiday-label">${holidayName}</span>` : ""}
                    </div>`;
            }
        }

        document.getElementById('btnP').onclick = () => mark('Present');
        document.getElementById('btnL').onclick = () => mark('Leave');
        document.getElementById('logoutBtn').onclick = () => signOut(auth);
    </script>
</body>
</html>
